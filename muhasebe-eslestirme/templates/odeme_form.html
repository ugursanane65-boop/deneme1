{% extends "base.html" %}

{% block title %}Yeni Ödeme{% endblock %}

{% block content %}
<section class="card">
    <h1>Yeni Ödeme Ekle</h1>

    {% if hatalar %}
    <ul class="error-list">
        {% for hata in hatalar %}
        <li>{{ hata }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="post">
        <label for="musteri_id">Müşteri</label>
        <select id="musteri_id" name="musteri_id" required>
            {% for musteri in musteriler %}
            <option value="{{ musteri.id }}">{{ musteri.unvan }}</option>
            {% endfor %}
        </select>

        <label for="odeme_no">Ödeme No</label>
        <input type="text" id="odeme_no" name="odeme_no">

        <label for="tutar">Tutar</label>
        <input type="number" step="0.01" id="tutar" name="tutar" required>

        <label for="yontem">Ödeme Yöntemi</label>
        <select id="yontem" name="yontem">
            <option value="havale">Havale/EFT</option>
            <option value="kredi_karti">Kredi Kartı</option>
            <option value="nakit">Nakit</option>
        </select>

        <label for="banka_hesabi">Banka Hesabı</label>
        <input type="text" id="banka_hesabi" name="banka_hesabi">

        <label for="referans_no">Referans No</label>
        <input type="text" id="referans_no" name="referans_no">

        <button type="submit" class="btn">Kaydet</button>
    </form>
</section>
{% endblock %}
