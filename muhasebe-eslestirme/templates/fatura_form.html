{% extends "base.html" %}

{% block title %}Yeni Fatura{% endblock %}

{% block content %}
<section class="card">
    <h1>Yeni Fatura Ekle</h1>

    {% if hatalar %}
    <ul class="error-list">
        {% for hata in hatalar %}
        <li>{{ hata }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="post">
        <label for="fatura_no">Fatura No</label>
        <input type="text" id="fatura_no" name="fatura_no" required>

        <label for="musteri_id">Müşteri</label>
        <select id="musteri_id" name="musteri_id" required>
            {% for musteri in musteriler %}
            <option value="{{ musteri.id }}">{{ musteri.unvan }}</option>
            {% endfor %}
        </select>

        <label for="net_tutar">Net Tutar</label>
        <input type="number" step="0.01" id="net_tutar" name="net_tutar" required>

        <label for="kdv_orani">KDV Oranı (%)</label>
        <input type="number" step="0.01" id="kdv_orani" name="kdv_orani" value="20">

        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama"></textarea>

        <button type="submit" class="btn">Kaydet</button>
    </form>
</section>
{% endblock %}
